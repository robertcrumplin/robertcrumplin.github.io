# On each arXiv announcement day: read the day's new papers, update the unlisted digest page
# (arxiv-1bhec9p544/), commit it, and ask GitHub Pages to republish the site.
# Run it by hand from the Actions tab with "Run workflow".
name: arXiv digest

on:
  schedule:
    # arXiv announces new papers Sunday to Thursday at 20:00 US Eastern time, and its feeds update at
    # midnight Eastern (05:00 UTC; 04:00 UTC in summer), so Monday to Friday mornings in UTC.
    # First try just after that, then a few retries the same morning in case arXiv is late
    # (as on 24 Nov 2026). Once the day's digest is done, the retries change nothing.
    - cron: '11 5,7,10,14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write   # to commit the page
  pages: write      # to request a Pages build

concurrency:
  group: arxiv-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the digest
        run: python .github/arxiv_digest.py
      - name: Commit and publish
        run: |
          if [ -z "$(git status --porcelain arxiv-1bhec9p544)" ]; then echo "Nothing new today."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arxiv-1bhec9p544
          git commit -m "arXiv digest $(date -u +%F)"
          git push
          # A push made with GITHUB_TOKEN does not trigger a Pages build by itself, so request one.
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            || echo "::warning::Could not request a Pages build; the page will update at the next push."
