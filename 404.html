<script>
  // Old Google Sites addresses -> the matching page of this site.
  (function () {
    var map = {
      '/home': '/',
      '/research': '/?p=research',
      '/teaching': '/?p=teaching',
      '/talksseminarsreading-groups': '/?p=talks',
      '/tropical-geometry-winter-semester': '/?p=tropical',

    if (map[path] !== undefined) location.replace(map[path]);
  })();
</script>
